[package]
name = "aguin"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark", "regex"] }
egui_extras = "0.37.0"
fancy-regex = "0.16"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
zstd = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"
